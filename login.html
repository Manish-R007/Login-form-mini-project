<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2{
            text-align: center;
            color: #371dfb;
            margin-bottom: 20px;
        }

        .card{
            background-color: #d5d4d4;
            border-radius: 10px;
            padding: 40px;
            width: 300px;   
        }

        form{
            display: flex;
            flex-direction: column;
        }

        input{
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 5px;
            background-color: #d8d8d8;
            border: 1px solid black;
        }

        button{
            padding: 10px;
            background-color: #1b81da;
            color: #fff;
            border-radius: 5px;
        }

        button:hover{
            background-color: #371dfb;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email" name="" id="" placeholder="email">
            <input type="password" name="" id="" placeholder="password">
            <button type="submit">Login</button>
        </form>
    </div>
</body>

</html>
